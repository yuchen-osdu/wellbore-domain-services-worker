# Service descriptor — owned by this repository, not by the template.
#
# Template-sync never overwrites `.spi/**`. Changes here are normal reviewed
# pull requests and select only unprivileged build/test behaviour: no Azure
# identity, cluster, namespace, environment, secret or workflow reference may
# appear in this file (ADR-039).
#
# Schema: .github/scripts/service-config/schema.json
# Generated during repository initialization; edit as the service evolves.

schemaVersion: 1

service:
  name: wellbore-domain-services-worker
  archetype: python-uv-fastapi

build:
  python:
    packageManager: uv
    lockfile: uv.lock
    runtimeVersion: "3.12"
    compatibilityVersions: ["3.13"]
    distribution: osdu-wbddms-worker
    importPackage: wdmsworker
    # Upstream unit tests import AWS provider modules, so CI installs the locked aws extra.
    testExtras: [dev, aws]
    runtimeExtras: [az]

tests:
  unit:
    type: pytest
    path: tests/unit
    coverage: true
  serviceInProcess:
    type: pytest
    path: tests/service
  serviceSubprocess:
    type: pytest
    path: tests/service

container:
  appModule: wdmsworker.app:app
