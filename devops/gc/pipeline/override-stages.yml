variables:
  GC_SERVICE: wellbore-worker
  GC_INT_TEST_TYPE: python

gc-containerize-bootstrap-gitlab:
  needs: []

gc-containerize-bootstrap-gcr:
  needs: []

gc-containerize-gitlab:
  needs: []
  variables:
    BUILD_PATH: "./devops/gc/Dockerfile"
  before_script:
    - echo "Building a new Docker image..."

gc-containerize-gitlab:baremetal:
  extends: gc-containerize-gitlab
  needs: []
  variables:
    BUILD_PATH: "./devops/baremetal/Dockerfile"
    IMAGE_NAME: bm-$GC_SERVICE
  before_script:
    - echo "Building a new Docker image..."

gc-containerize-gcr:
  needs: []
  variables:
    BUILD_PATH: "./devops/gc/Dockerfile"

gc-helm-charts-gitlab:
  needs:
    - "gc-containerize-gitlab"
    - "gc-containerize-gitlab:baremetal"
  variables:
    GIT_DEPTH: 20
    GC_IMAGE_NAME: gc-$GC_SERVICE
    BM_IMAGE_NAME: bm-$GC_SERVICE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - !reference [.commits_behind_main_check, script]
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      if [[ $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH ]];
      then
        GC_IMAGE_NAME=$GC_IMAGE_NAME-master;
        BM_IMAGE_NAME=$BM_IMAGE_NAME-master;
        HELM_TAG=latest;
      else
        HELM_TAG=gc$CI_COMMIT_SHORT_SHA
      fi
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - yq -e '.data | has("gcImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && GC_IMAGE="$CI_REGISTRY_IMAGE/$GC_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.gcImage = env(GC_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - yq -e '.data | has("bmImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && BM_IMAGE="$CI_REGISTRY_IMAGE/$BM_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.bmImage = env(BM_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - cat $GC_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image

gc-helm-charts-release-gitlab:
  needs:
    - "gc-containerize-gitlab"
    - "gc-containerize-gitlab:baremetal"
  variables:
    GC_IMAGE_NAME: gc-$GC_SERVICE
    BM_IMAGE_NAME: bm-$GC_SERVICE
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - >
      if echo $CI_COMMIT_REF_NAME | grep -Eq "^release\/[0-9]{1,2}.[0-9]{1,2}$";
      then
        GC_IMAGE_NAME=$GC_IMAGE_NAME-release;
        BM_IMAGE_NAME=$BM_IMAGE_NAME-release;
        IMAGE_TAG=$CI_COMMIT_SHORT_SHA;
      fi
    - >
      if [[ $CI_COMMIT_TAG != "" ]];
      then
        IMAGE_TAG=$CI_COMMIT_TAG;
      fi
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - yq -e '.data | has("gcImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && GC_IMAGE="$CI_REGISTRY_IMAGE/$GC_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.gcImage = env(GC_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - yq -e '.data | has("bmImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && BM_IMAGE="$CI_REGISTRY_IMAGE/$BM_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.bmImage = env(BM_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - cat $GC_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image

gc-helm-charts-release-gcr:
  environment:
    name: GC_Baremetal
  stage: containerize
  tags: ["osdu-small"]
  needs:
    - "gc-containerize-gitlab"
    - "gc-containerize-gitlab:baremetal"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/${GC_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${GC_POOL_ID}/providers/${GC_PROVIDER_ID}
  image:
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    entrypoint: [""]
  variables:
    GC_SA_EMAIL: gitlab-gcr@osdu-anthos.iam.gserviceaccount.com
    GC_PROJECT_NUMBER: 1049387600826
    GC_POOL_ID: baremetal
    GC_PROVIDER_ID: baremetal-gitlab
    GC_IMAGE_NAME: gc-$GC_SERVICE
    BM_IMAGE_NAME: bm-$GC_SERVICE
    IMAGE_TAG: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl bash
    - curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | VERIFY_CHECKSUM=false bash
    - !reference [.gc_obtain_credentials, script]
    - gcloud auth configure-docker gcr.io
    - wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && chmod +x /usr/bin/yq
    - yq -e '.data | has("gcImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && GC_IMAGE="$CI_REGISTRY_IMAGE/$GC_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.gcImage = env(GC_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - yq -e '.data | has("bmImage")' $GC_HELM_DEPLOYMENT_DIR/values.yaml &>/dev/null && BM_IMAGE="$CI_REGISTRY_IMAGE/$BM_IMAGE_NAME:$IMAGE_TAG" yq -i '.data.bmImage = env(BM_IMAGE)' $GC_HELM_DEPLOYMENT_DIR/values.yaml
    - cat $GC_HELM_DEPLOYMENT_DIR/values.yaml | grep -i image

# COMMUNITY
gc-deploy:
  before_script:
    - echo "Deploying a new App version..."

gc-osdutest:
  rules:
    - exists:
        - never/existing/file.txt

gc-test-python:
  rules:
    - exists:
        - never/existing/file.txt

# DEV2
gc-dev2-deploy:
  before_script:
    - echo "Deploying a new App version..."

gc-dev2-test-python:
  rules:
    - exists:
        - never/existing/file.txt

gc-dev2-osdutest:
  rules:
    - exists:
        - never/existing/file.txt

# PRESHIP
gc-preship-deploy:
  before_script:
    - echo "Deploying a new App version..."
