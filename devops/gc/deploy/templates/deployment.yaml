apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.conf.appName | quote }}
    type: ddms
    source: python
  name: {{ .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.conf.appName | quote }}
  replicas: {{ .Values.conf.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.conf.appName | quote }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      containers:
        - name: {{ .Values.conf.appName | quote }}
          {{- if .Values.global.onPremEnabled }}
          image: {{ .Values.data.bmImage | quote }}
          {{- else }}
          image: {{ .Values.data.gcImage | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.data.imagePullPolicy | quote }}
          envFrom:
          - configMapRef:
              name: {{ .Values.conf.configmap | quote }}
          {{- if .Values.global.onPremEnabled }}
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conf.minioSecretName | quote }}
                  key: MINIO_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conf.minioSecretName | quote }}
                  key: MINIO_SECRET_KEY
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.conf.minioSecretName | quote }}
                  key: MINIO_ENDPOINT
          {{- end }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.data.requestsCpu | quote }}
              memory: {{ .Values.data.requestsMemory | quote }}
            {{- if .Values.global.limitsEnabled }}
            limits:
              cpu: {{ .Values.data.limitsCpu | quote }}
              memory: {{ .Values.data.limitsMemory | quote }}
            {{- end }}
      serviceAccountName: {{ .Values.data.serviceAccountName | quote }}
