apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.conf.appName | quote }}
    type: ddms
    source: python
  name: {{ .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.conf.appName | quote }}
  replicas: {{ .Values.conf.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.conf.appName | quote }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      containers:
        - name: {{ .Values.conf.appName | quote }}
          image: {{ .Values.data.image | quote }}
          imagePullPolicy: {{ .Values.data.imagePullPolicy | quote }}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/wdms-worker/healthz
              port: 8080
            initialDelaySeconds: 190
            periodSeconds: 60
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/wdms-worker/readiness
              port: 8080
            periodSeconds: 60
          envFrom:
          - configMapRef:
              name: {{ .Values.conf.configmap | quote }}
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s" .Values.global.dataPartitionId .Values.conf.s3SecretName | quote }}
                  key: {{ printf "SEAWEEDFS_ACCESS_KEY_%s" .Values.global.dataPartitionId | upper | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s" .Values.global.dataPartitionId .Values.conf.s3SecretName | quote }}
                  key: {{ printf "SEAWEEDFS_SECRET_KEY_%s" .Values.global.dataPartitionId | upper | quote }}
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s" .Values.global.dataPartitionId .Values.conf.s3SecretName | quote }}
                  key: {{ printf "SEAWEEDFS_ENDPOINT_%s" .Values.global.dataPartitionId | upper | quote }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.data.requestsCpu | quote }}
              memory: {{ .Values.data.requestsMemory | quote }}
            {{- if .Values.global.limitsEnabled }}
            limits:
              cpu: {{ .Values.data.limitsCpu | quote }}
              memory: {{ .Values.data.limitsMemory | quote }}
            {{- end }}
      serviceAccountName: {{ .Values.data.serviceAccountName | quote }}
