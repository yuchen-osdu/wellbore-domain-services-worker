apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-nw-policy{{ $nameSuffix }}
  annotations:
{{ include "os-wellbore-ddms-worker.commonAnnotations" . | indent 4}}
  labels:
{{ include "os-wellbore-ddms-worker.commonLabels" . | indent 4}}
{{ include "os-wellbore-ddms-worker.namespace" . | indent 2}}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.deployment.name }}{{ $nameSuffix }}
  ingress:
     - from:
       - podSelector:
           matchLabels:
            app: os-wellbore-ddms{{ $nameSuffix }}