# Template pipeline used to build and test the worker with different python versions

parameters:
- name: python_version
  type: string
  default: ''

steps:
# Use Python version
# Use the specified version of Python from the tool cache, optionally adding it to the PATH
- task: UsePythonVersion@0
  inputs:
    versionSpec: ${{ parameters.python_version }}
    addToPath: true
    architecture: 'x64'

- bash: |
    pip install -e ".[dev]"
    
    # used to publish tests results
    pip install pytest-azurepipelines
  displayName: 'setup environment'
  env:
    PIP_EXTRA_INDEX_URL: https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple

- bash: |
    pytest -s --log-cli-level=INFO --junitxml=report_tests_unit.xml -o junit_suite_name=wdms_worker_ut_${{ parameters.python_version }} --cov=wdmsworker --cov-report=xml --cov-report=html --test-run-title='Worker unit tests' ./tests/unit
  displayName: 'Run unit tests'

- bash: |
    pytest -s --no-subprocess --log-cli-level=INFO --junitxml=report_tests_srv2.xml -o junit_suite_name=wdms_worker_srv2_${{ parameters.python_version }} --cov=wdmsworker --cov-append --cov-report=xml --test-run-title='Worker service tests' ./tests/service
  displayName: 'Run service tests - subprocess'

- bash: |
    # remove coverage args because already gathered above
    pytest -s --log-cli-level=INFO ./tests/service
  displayName: 'Run service tests'


- task: PublishCodeCoverageResults@1
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
