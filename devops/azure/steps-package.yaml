# Template pipeline used to build and test the worker with different python versions

parameters:
- name: python_version
  type: string
  default: ''
- name: uploadDevPkg
  type: boolean
  default: false
  displayName: generate dev package (not master)

steps:
# Use Python version
# Use the specified version of Python from the tool cache, optionally adding it to the PATH
- task: UsePythonVersion@0
  inputs:
    versionSpec: ${{ parameters.python_version }}
    addToPath: true
    architecture: 'x64'

- task: PipAuthenticate@1
  inputs:
    artifactFeeds: $(feed-name)
    onlyAddExtraIndex: true

- bash: |
    export PIP_EXTRA_INDEX_URL=https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple
    python -m venv venv
    source venv/bin/activate
    pip install -e ".[dev]"
  displayName: 'setup environment'

- script: pip install --upgrade pip setuptools wheel twine build
  displayName: 'Install build tools'

- script: python -m build
  displayName: 'Create distribution package'

- task: TwineAuthenticate@0
  enabled: false
  displayName: 'Twine Authenticate to $(feed-name)'
  condition: and(succeeded(), eq(variables.uploadPkg, true))
  inputs:
    artifactFeeds: $(feed-name)

- script: python -m twine upload -r $(feed-name) --config-file $(PYPIRC_PATH) dist/*
  enabled: false
  displayName: 'Publish package into feed: $(feed-name)'
  condition: and(succeeded(), eq(variables.uploadPkg, true))
