[build-system]
requires = ["setuptools >= 70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wdmsworker"
authors = [{name = "WDMS team"}]
description = "WDMS bulk worker service."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python", "wdms", "bulk"]
requires-python = ">=3.10"
version = "0.1.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pandas~=1.5.2",
    "numpy<2.0.0",
    "pyarrow>=14.0.1",
    "natsort",
    "fastapi~=0.115.6",
    "uvicorn",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-semantic-conventions",
    "requests>=2.31.0",
    "osdu-core-lib-python==3.0.0",
    "pydantic==1.10.15",
]

[project.urls]
Home = "https://community.opengroup.org/osdu/platform/domain-data-mgmt-services/wellbore/wellbore-domain-services-worker"

[project.optional-dependencies]
test = [
    "anyio>=4.4.0",  # major 4 introduced breaking changes on exception management on task group
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "requests",  # based http client for the service tests
    "httpx",  # used by FastAPI/starlette TestClient
    "fsspec",  # local blob storage
    "certifi>=2023.7.22",
    "cryptography>=43.0.1",
]
dev = [
    "wdmsworker[test]",  # dependencies for tests
    "black==25.1.0",  # formatting
    "mypy",  # typing check
    "flake8",
    "Flake8-pyproject",
    "pre-commit", # for adding git pre-commit hook to run flake8, mypy and black automatically
    "types-requests", # for mypy support for requests
]

pkg = [
    "setuptools",
    "wheel",
    "build"
]

# cloud provider specific dependencies
az = [
    "azure-monitor-opentelemetry-exporter",
    "osdu-core-lib-python-azure==3.1.0",
    "aiohttp>=3.9.5",
    "msal>=1.24.1 "
]

aws = [
    "boto3",
    "botocore",
    "osdu-core-lib-python-aws==2.2.1",
]

ibm = [
    "aiohttp>=3.8.0",
    "osdu-core-lib-python-ibm==3.0.1",
]

gc = [
    "osdu-core-lib-python-gcp==2.1.3",
    "opentelemetry-exporter-gcp-trace"
]

baremetal = [
    "aiohttp>=3.9.1",
    "boto3",
    "botocore",
    "requests",
    "osdu-api~=0.21.0rc",
    "osdu-core-lib-python-baremetal==2.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "perf: performance test, usually slow test"
]
#addopts = "--p no:randomly"  # uncomment to disable random order testing

[tool.mypy]
ignore_missing_imports = "True"

[tool.black]
line-length = 120
target-version = ['py311']
# Preview allows to split long strings
preview = true
exclude = '''
^/(
  (
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv.*      # exclude all .venv
    | venv.*        # exclude all venv
    | \.idea
    | \.pytest_cache
    | \.hypothesis
    | \.vscode
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.flake8]
ignore = [
    'E203',  # See https://github.com/PyCQA/pycodestyle/issues/373
    'W503',  # W504 preferred
    'E501',  # 120 chars instead of 79
]
per-file-ignores = [
    '__init__.py:F401',  # disable unsued import file in __init__.py
]
max-line-length = 120
