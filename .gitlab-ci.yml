default:
  image: python:3.10-slim-bullseye
  before_script:
    - export PIP_EXTRA_INDEX_URL=https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple
    - pip3 install -e ".[dev]"

stages:
  - linting
  - testing

linters-check:
  tags: ["osdu-small"]
  stage: linting
  script:
    - black . --check
    - flake8 ./src
    - mypy ./src

unit-tests:
  tags: ["osdu-small"]
  stage: testing
  script:
    - coverage run -m pytest ./tests/unit --junitxml=report.xml
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


service-tests:
  tags: ["osdu-small"]
  stage: testing
  script:
    - coverage run -m pytest ./tests/service --junitxml=report.xml
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

