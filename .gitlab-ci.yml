default:
  image: python:3.10-slim-bullseye

stages:
  - testing

before_script:
  - export PIP_EXTRA_INDEX_URL=https://community.opengroup.org/api/v4/projects/465/packages/pypi/simple
  - pip3 install -e ".[dev]"

linters-check:
  tags: ["osdu-small"]
  stage: testing
  script:
    - black . --check
    - flake8 ./src
    - mypy ./src

unit-tests:
  tags: ["osdu-small"]
  stage: testing
  script:
    - pytest ./tests/unit

service-tests:
  tags: ["osdu-small"]
  stage: testing
  script:
    - pytest ./tests/service

