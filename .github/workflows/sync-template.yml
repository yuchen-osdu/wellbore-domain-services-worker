name: Sync Template

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-acceptance-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42  # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open acceptance runner pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head feat/issue-3-python-acceptance \
            --title "test: add SPI live worker acceptance runner" \
            --body "Adds the descriptor-owned pytest runner and verifies the candidate worker through main WDMS bulk round-trip and asynchronous statistics operations. Part of #3."
